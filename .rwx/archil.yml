on:
  cli:
    init:
      disk: rwx/dan-testing
      region: aws-us-east-1

base:
  image: ubuntu:24.04
  config: rwx/base 1.0.2

tasks:
  - key: install-archil
    run: |
      sudo apt-get update
      sudo apt-get install -y libfuse2t64
      curl -sSf https://archil.com/install | sh
      archil --version

  - key: archil-demo
    use: install-archil
    env:
      ARCHIL_MOUNT_TOKEN: ${{ secrets.ARCHIL_MOUNT_TOKEN }}
    run: |
      set -euo pipefail

      echo "=== mounting ${{ init.disk }} (${{ init.region }}) ==="
      sudo mkdir -p /mnt/archil
      sudo --preserve-env=ARCHIL_MOUNT_TOKEN archil mount \
        "${{ init.disk }}" /mnt/archil \
        --region "${{ init.region }}" \
        --shared
      mountpoint /mnt/archil
      trap 'sudo archil unmount /mnt/archil || true' EXIT

      echo "=== existing contents of /mnt/archil ==="
      ls -la /mnt/archil
      find /mnt/archil -maxdepth 3 -type f 2>/dev/null | head -20 || true

      echo "=== writing files for this run ==="
      # Shared mode is read-only by default. Creating a brand-new directory
      # grants this client dynamic ownership of it, so we can write into it.
      # We create/write with sudo (archil runs as root here) and never touch
      # files owned by other runs, so no recursive chown is needed.
      RUN_DIR="/mnt/archil/rwx-runs/${RWX_RUN_ID:-local}"
      sudo mkdir -p "$RUN_DIR"
      echo "Hello from RWX run ${RWX_RUN_ID:-local} at $(date -u +%FT%TZ)" \
        | sudo tee "$RUN_DIR/greeting.txt" > /dev/null
      uname -a | sudo tee "$RUN_DIR/host.txt" > /dev/null
      sudo ls -la "$RUN_DIR"

      echo "=== reading back ==="
      cat "$RUN_DIR/greeting.txt"
      cat "$RUN_DIR/host.txt"

      echo "=== current ownership delegations ==="
      sudo archil delegations /mnt/archil

      echo "=== unmounting ==="
      sudo archil unmount /mnt/archil
      trap - EXIT

  - key: benchmark
    use: archil-demo
    env:
      ARCHIL_MOUNT_TOKEN: ${{ secrets.ARCHIL_MOUNT_TOKEN }}
    run: |
      set -euo pipefail

      mount_disk() {
        sudo --preserve-env=ARCHIL_MOUNT_TOKEN archil mount \
          "${{ init.disk }}" /mnt/archil \
          --region "${{ init.region }}" \
          --shared
      }

      sudo mkdir -p /mnt/archil

      echo "=== generating 100 MB of random data in /tmp ==="
      dd if=/dev/urandom of=/tmp/bench.bin bs=1M count=100 status=none
      ls -la /tmp/bench.bin

      echo "=== mount #1 ==="
      mount_disk
      # Per-run directory so concurrent/previous runs don't collide. Creating
      # it grants dynamic ownership, so writes succeed in shared (read-only)
      # mode without checkout or chown. All writes go through sudo.
      BENCH_DIR="/mnt/archil/bench/${RWX_RUN_ID:-local}"
      sudo mkdir -p "$BENCH_DIR"

      echo "=== write benchmark: 100 MB (includes fsync) ==="
      sudo dd if=/tmp/bench.bin of="$BENCH_DIR/bench.bin" bs=1M conv=fsync
      sudo ls -la "$BENCH_DIR/bench.bin"

      echo "=== unmount (flushes + drops local cache) ==="
      sudo archil unmount /mnt/archil

      echo "=== mount #2 (fresh cache) ==="
      mount_disk

      echo "=== read benchmark: 100 MB ==="
      sudo dd if="$BENCH_DIR/bench.bin" of=/dev/null bs=1M

      echo "=== integrity check ==="
      sudo sha256sum /tmp/bench.bin "$BENCH_DIR/bench.bin"

      echo "=== unmount ==="
      sudo archil unmount /mnt/archil

  - key: benchmark-small-files
    use: install-archil
    # Small-file I/O over the network is far slower per byte than the bulk
    # benchmark, so raise the default 10-minute task timeout.
    timeout: 30m
    env:
      ARCHIL_MOUNT_TOKEN: ${{ secrets.ARCHIL_MOUNT_TOKEN }}
    run: |
      set -euo pipefail

      mount_disk() {
        sudo --preserve-env=ARCHIL_MOUNT_TOKEN archil mount \
          "${{ init.disk }}" /mnt/archil \
          --region "${{ init.region }}" \
          --shared
      }

      # Many-small-files benchmark. Tune NUM_FILES to scale the workload;
      # total size = NUM_FILES * FILE_SIZE. 102400 x 1 KiB == 100 MiB, but the
      # cold sequential content read runs at ~17 ms/file, so a full 100 MiB
      # would take ~30 min. 12000 files keeps the task within ~5 minutes.
      NUM_FILES=12000
      FILE_SIZE=1024
      SRC=/tmp/smallfiles
      DEST="/mnt/archil/small-files/${RWX_RUN_ID:-local}"

      now_ns() { date +%s%N; }
      # report <label> <elapsed_ns> <bytes> <count>
      report() {
        awk -v n="$1" -v ns="$2" -v b="$3" -v c="$4" 'BEGIN {
          s = ns / 1e9;
          printf "  %-26s %8.3f s   %8.2f MB/s   %10.0f files/s\n", \
            n, s, (b / 1048576) / s, c / s;
        }'
      }

      echo "=== generating ${NUM_FILES} x ${FILE_SIZE} B files locally ==="
      # Generate in a single fast pass: one blob split into exact FILE_SIZE
      # pieces. This avoids per-file shell forks so generation time (which we do
      # NOT benchmark) stays small and doesn't pollute the Archil measurements.
      rm -rf "$SRC"; mkdir -p "$SRC"
      dd if=/dev/urandom of=/tmp/blob.bin bs="$FILE_SIZE" count="$NUM_FILES" status=none
      split -b "$FILE_SIZE" -d -a 6 /tmp/blob.bin "$SRC/f_"
      GEN_COUNT=$(find "$SRC" -type f | wc -l)
      SRC_BYTES=$(du -sb "$SRC" | cut -f1)
      echo "  generated ${GEN_COUNT} files, ${SRC_BYTES} bytes"

      echo "=== mount #1 ==="
      sudo mkdir -p /mnt/archil
      mount_disk
      # New per-run dir -> dynamic ownership grants write access in shared mode.
      sudo mkdir -p "$DEST"

      echo "=== write benchmark: create ${NUM_FILES} x 1 KiB files ==="
      t0=$(now_ns)
      sudo cp -r "$SRC/." "$DEST/"
      t1=$(now_ns)
      WRITE_NS=$((t1 - t0))

      echo "=== flush benchmark: unmount (fsync all + drop cache) ==="
      t0=$(now_ns)
      sudo archil unmount /mnt/archil
      t1=$(now_ns)
      FLUSH_NS=$((t1 - t0))

      echo "=== mount #2 (fresh cache) ==="
      mount_disk

      echo "=== read benchmark (cold): metadata walk ==="
      t0=$(now_ns)
      DEST_COUNT=$(find "$DEST" -type f | wc -l)
      t1=$(now_ns)
      LIST_NS=$((t1 - t0))

      echo "=== read benchmark (cold): full content (hash manifest) ==="
      # One sequential pass that reads every byte; the sha256 doubles as the
      # integrity manifest, so DEST content is read exactly once.
      t0=$(now_ns)
      find "$DEST" -type f -print0 | xargs -0 sha256sum > /tmp/dest.manifest
      t1=$(now_ns)
      READ_NS=$((t1 - t0))

      echo "=== integrity check ==="
      # SRC manifest is local disk (fast); compare the sorted hash multisets.
      find "$SRC" -type f -print0 | xargs -0 sha256sum > /tmp/src.manifest
      DEST_BYTES=$(du -sb "$DEST" | cut -f1)
      SRC_HASH=$(awk '{print $1}' /tmp/src.manifest | sort | sha256sum | cut -d' ' -f1)
      DEST_HASH=$(awk '{print $1}' /tmp/dest.manifest | sort | sha256sum | cut -d' ' -f1)
      echo "  files:       src=${GEN_COUNT}  dest=${DEST_COUNT}"
      echo "  bytes:       src=${SRC_BYTES}  dest=${DEST_BYTES}"
      echo "  fingerprint: src=${SRC_HASH}"
      echo "  fingerprint: dest=${DEST_HASH}"
      if [ "$SRC_HASH" != "$DEST_HASH" ] || [ "$GEN_COUNT" != "$DEST_COUNT" ]; then
        echo "INTEGRITY CHECK FAILED" >&2
        exit 1
      fi
      echo "  integrity OK"

      echo "=== results: ${NUM_FILES} x ${FILE_SIZE} B small-file benchmark ==="
      report "write (create files)"   "$WRITE_NS" "$SRC_BYTES" "$NUM_FILES"
      report "flush (unmount)"        "$FLUSH_NS" "$SRC_BYTES" "$NUM_FILES"
      report "read - metadata walk"   "$LIST_NS"  "$SRC_BYTES" "$NUM_FILES"
      report "read - full content"    "$READ_NS"  "$SRC_BYTES" "$NUM_FILES"

      echo "=== unmount ==="
      sudo archil unmount /mnt/archil

  - key: benchmark-small-files-prefetch
    # Runs after benchmark-small-files (via `use`) so the cold and prefetched
    # reads are measured back-to-back in the same run, without competing for the
    # disk. Same workload; the only difference is `archil prefetch` + a fixed
    # warmup wait before the read, so reads should hit warm cache.
    use: benchmark-small-files
    timeout: 30m
    env:
      ARCHIL_MOUNT_TOKEN: ${{ secrets.ARCHIL_MOUNT_TOKEN }}
    run: |
      set -euo pipefail

      mount_disk() {
        sudo --preserve-env=ARCHIL_MOUNT_TOKEN archil mount \
          "${{ init.disk }}" /mnt/archil \
          --region "${{ init.region }}" \
          --shared
      }

      NUM_FILES=12000           # match the cold baseline for apples-to-apples
      FILE_SIZE=1024
      PREFETCH_WAIT=90          # seconds to let background prefetch warm cache
      SRC=/tmp/smallfiles
      DEST="/mnt/archil/small-files-prefetch/${RWX_RUN_ID:-local}"

      now_ns() { date +%s%N; }
      # report <label> <elapsed_ns> <bytes> <count>
      report() {
        awk -v n="$1" -v ns="$2" -v b="$3" -v c="$4" 'BEGIN {
          s = ns / 1e9;
          printf "  %-30s %8.3f s   %8.2f MB/s   %10.0f files/s\n", \
            n, s, (b / 1048576) / s, c / s;
        }'
      }

      echo "=== generating ${NUM_FILES} x ${FILE_SIZE} B files locally ==="
      rm -rf "$SRC"; mkdir -p "$SRC"
      dd if=/dev/urandom of=/tmp/blob.bin bs="$FILE_SIZE" count="$NUM_FILES" status=none
      split -b "$FILE_SIZE" -d -a 6 /tmp/blob.bin "$SRC/f_"
      GEN_COUNT=$(find "$SRC" -type f | wc -l)
      SRC_BYTES=$(du -sb "$SRC" | cut -f1)
      echo "  generated ${GEN_COUNT} files, ${SRC_BYTES} bytes"

      echo "=== mount #1 ==="
      sudo mkdir -p /mnt/archil
      mount_disk
      sudo mkdir -p "$DEST"

      echo "=== write ${NUM_FILES} files ==="
      sudo cp -r "$SRC/." "$DEST/"

      echo "=== unmount (flush + drop cache) ==="
      sudo archil unmount /mnt/archil

      echo "=== mount #2 (fresh cache) ==="
      mount_disk

      # `archil prefetch <ABSOLUTE_PATH>...` warms paths into cache in the
      # background and returns immediately (per its --help). IMPORTANT: prefetch
      # is documented as "Native-format filesystems only" — the object-storage
      # backed disk rwx/dan-testing returns InvalidArguments for every path form.
      # We run it best-effort and only wait for warmup if it was accepted, so
      # this task also works unchanged on a native-format disk.
      echo "=== prefetch ${DEST} ==="
      t0=$(now_ns)
      if sudo archil prefetch "$DEST"; then
        t1=$(now_ns)
        awk -v ns="$((t1 - t0))" 'BEGIN { printf "  prefetch accepted, returned in %.3f s (async)\n", ns / 1e9 }'
        echo "  waiting ${PREFETCH_WAIT}s for background warmup..."
        sleep "$PREFETCH_WAIT"
        PREFETCH_STATE="ok (${PREFETCH_WAIT}s warmup)"
      else
        echo "  prefetch NOT supported for this disk (native-format filesystems"
        echo "  only) -> reads below are effectively cold; skipping warmup wait"
        PREFETCH_STATE="unsupported"
      fi
      sudo archil status /mnt/archil || true

      echo "=== read (post-prefetch): metadata walk ==="
      t0=$(now_ns)
      DEST_COUNT=$(find "$DEST" -type f | wc -l)
      t1=$(now_ns)
      LIST_NS=$((t1 - t0))

      echo "=== read (post-prefetch): full content (hash manifest) ==="
      t0=$(now_ns)
      find "$DEST" -type f -print0 | xargs -0 sha256sum > /tmp/dest.manifest
      t1=$(now_ns)
      READ_NS=$((t1 - t0))

      echo "=== integrity check ==="
      find "$SRC" -type f -print0 | xargs -0 sha256sum > /tmp/src.manifest
      SRC_HASH=$(awk '{print $1}' /tmp/src.manifest | sort | sha256sum | cut -d' ' -f1)
      DEST_HASH=$(awk '{print $1}' /tmp/dest.manifest | sort | sha256sum | cut -d' ' -f1)
      echo "  files:       src=${GEN_COUNT}  dest=${DEST_COUNT}"
      echo "  fingerprint: src=${SRC_HASH}"
      echo "  fingerprint: dest=${DEST_HASH}"
      if [ "$SRC_HASH" != "$DEST_HASH" ] || [ "$GEN_COUNT" != "$DEST_COUNT" ]; then
        echo "INTEGRITY CHECK FAILED" >&2
        exit 1
      fi
      echo "  integrity OK"

      echo "=== results: ${NUM_FILES} x ${FILE_SIZE} B (prefetch: ${PREFETCH_STATE}) ==="
      report "read - metadata walk"    "$LIST_NS" "$SRC_BYTES" "$NUM_FILES"
      report "read - full content"     "$READ_NS" "$SRC_BYTES" "$NUM_FILES"

      echo "=== unmount ==="
      sudo archil unmount /mnt/archil
